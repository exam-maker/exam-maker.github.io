<!DOCTYPE html><html lang="ko"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>영어 내신 기출 분석 & 변형문제 생성</title>  <link rel="stylesheet" href="css/app.css"></head><body>  <header class="app-header">    <h1>영어 내신 기출 분석 &amp; 변형문제 생성</h1>    <span class="beta-badge">베타</span>  </header><nav class="tab-bar" role="tablist">    <button class="tab-btn" data-tab="settings" role="tab">① 설정</button>    <button class="tab-btn" data-tab="analyze" role="tab">② 기출 분석</button>    <button class="tab-btn" data-tab="passages" role="tab">③ 시험 범위</button>    <button class="tab-btn" data-tab="generate" role="tab">④ 변형문제 생성</button>    <button class="tab-btn" data-tab="print" role="tab">⑤ 출력</button>  </nav><main class="app-main">    <section class="tab-panel" id="tab-settings" data-panel="settings">      <h2>설정</h2>      <p class="placeholder">T3 단계에서 만들어집니다.</p>    </section>    <section class="tab-panel" id="tab-analyze" data-panel="analyze">      <h2>기출 분석</h2>      <p class="placeholder">T6 단계에서 만들어집니다.</p>    </section>    <section class="tab-panel" id="tab-passages" data-panel="passages">      <h2>시험 범위</h2>      <p class="placeholder">T7 단계에서 만들어집니다.</p>    </section>    <section class="tab-panel" id="tab-generate" data-panel="generate">      <h2>변형문제 생성</h2>      <p class="placeholder">T8 단계에서 만들어집니다.</p>    </section>    <section class="tab-panel" id="tab-print" data-panel="print">      <h2>출력</h2>      <p class="placeholder">T9 단계에서 만들어집니다.</p>    </section></main><footer class="app-footer">    <p>생성물은 AI가 만든 것으로 오류가 있을 수 있으며, 검수와 이용 책임은 사용자에게 있습니다.</p>  </footer>  <script type="module" src="js/main.js"></script></body></html>
